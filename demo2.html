<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 50px;
        height: 50px;
        background-color: skyblue;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .box-lei::before {
        content: "💣";
      }
      .box-qs::before {
        content: "❓";
      }
      .box-flag::before {
        content: "🚩";
      }
      .open {
        background-color: gray;
      }
      .box-1::before {
        content: "1";
        color: red;
      }
      .box-2::before {
        content: "2";
        color: blue;
      }
      .box-3::before {
        content: "3";
        color: green;
      }
    </style>
  </head>
  <body>
    <div class="box box-flag"></div>
    <div class="box  open box-2"></div>
  </body>
</html>
